name: Dev CI/CD Pipeline

on:
  push:
    branches:
      - dev

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore ./Apps-Apis/Apps-Apis.csproj

      - name: Build Project
        run: dotnet build ./Apps-Apis/Apps-Apis.csproj -c Release --no-restore

      - name: Run Tests
        run: dotnet test -c Release --no-build

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: yassin4276
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./Apps-Apis
          file: ./Apps-Apis/Dockerfile
          push: true
          tags: |
            ghcr.io/yassin4276/apps-apis:dev-latest
            ghcr.io/yassin4276/apps-apis:dev-${{ github.sha }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/apps-dashboard
            docker login ghcr.io -u yassin4276 -p ${{ secrets.GITHUB_TOKEN }}
            docker compose pull
            docker compose up -d
            docker image prune -f